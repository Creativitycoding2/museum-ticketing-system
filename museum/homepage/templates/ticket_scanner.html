<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Scanner - Museum</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white border-b">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="{% url 'home' %}" class="text-xl font-bold">
                Museum
            </a>

            <a href="{% url 'admin_dashboard' %}"
               class="hover:text-gray-600">
                Admin Dashboard
            </a>

        </div>
    </nav>


    <main class="max-w-xl mx-auto px-6 py-12">

        <h1 class="text-3xl font-bold mb-2">
            Ticket Scanner
        </h1>

        <p class="text-gray-600 mb-8">
            Scan a visitor's QR ticket to verify it.
        </p>


        <div class="bg-white border rounded-xl p-6 shadow-sm">

            <div id="reader" class="w-full"></div>

            <div id="result"
                 class="hidden mt-6 p-4 rounded-lg">
            </div>

        </div>

    </main>

<form id="csrf-form" style="display: none;">
    {% csrf_token %}
</form>
    <script>

        function showResult(data, ticketId) {
    const result = document.getElementById("result");

    result.classList.remove(
        "hidden",
        "bg-green-100",
        "bg-red-100"
    );

    if (data.valid) {
        result.classList.add("bg-green-100");

        result.innerHTML = `
            <h2 class="text-xl font-bold text-green-700">
                ✓ VALID TICKET
            </h2>

            <p class="mt-2">
                Type: ${data.type}
            </p>

            <p>
                Status: ${data.status}
            </p>

            <button
                onclick="checkInTicket('${ticketId}')"
                class="mt-4 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
            >
                Check In
            </button>
        `;
    } else {
        result.classList.add("bg-red-100");

        result.innerHTML = `
    <h2 class="text-xl font-bold text-red-700">
        ✕ INVALID TICKET
    </h2>

    <p class="mt-2">
        Status: ${data.status}
    </p>

    <button
        onclick="restartScanner()"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
    >
        Scan Next Ticket
    </button>
`;
    }
}
function checkInTicket(ticketId) {
    const csrfToken = document.querySelector(
        '[name=csrfmiddlewaretoken]'
    ).value;

    fetch(
        `/staff/ticket/${ticketId}/check-in/`,
        {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "X-CSRFToken": csrfToken
            }
        }
    )
    .then(response => response.json())
    .then(data => {
        const result = document.getElementById("result");

        if (data.success) {
            result.classList.remove(
                "bg-green-100",
                "bg-red-100"
            );

            result.classList.add("bg-green-100");

           result.innerHTML = `
    <h2 class="text-xl font-bold text-green-700">
        ✓ CHECK-IN SUCCESSFUL
    </h2>

    <p class="mt-2">
        Ticket status: ${data.status}
    </p>

    <button
        onclick="restartScanner()"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
    >
        Scan Next Ticket
    </button>
`;
        } else {
            result.classList.remove("bg-green-100");
            result.classList.add("bg-red-100");

            result.innerHTML = `
    <h2 class="text-xl font-bold text-green-700">
        ✓ CHECK-IN SUCCESSFUL
    </h2>

    <p class="mt-2">
        Ticket status: ${data.status}
    </p>

    <button
        onclick="restartScanner()"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
    >
        Scan Next Ticket
    </button>
`;
        }
    })
    .catch(error => {
        console.error(error);
    });
}
function restartScanner() {
    const result = document.getElementById("result");

    result.classList.add("hidden");
    result.innerHTML = "";

    const reader = document.getElementById("reader");
    reader.innerHTML = "";

    const scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },
        false
    );

    scanner.render(
        onScanSuccess,
        onScanFailure
    );
}

        function verifyTicket(ticketId) {

            fetch(
                `/staff/ticket/${ticketId}/verify/`,
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            )
            .then(response => {

                if (!response.ok) {
                    throw new Error("Ticket verification failed.");
                }

                return response.json();
            })
            .then(data => {

                showResult(data, ticketId);

            })
            .catch(error => {
                const result = document.getElementById("result");

                result.classList.remove(
                    "hidden",
                    "bg-green-100"
                );

                result.classList.add("bg-red-100");

                result.innerHTML = `
                    <h2 class="text-xl font-bold text-red-700">
                        Verification Error
                    </h2>

                    <p class="mt-2">
                        ${error.message}
                    </p>

                    <button
                        onclick="restartScanner()"
                        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                    >
                        Scan Next Ticket
                    </button>
                `;

            });
        }


        function onScanSuccess(decodedText, decodedResult) {

            console.log("QR detected:", decodedText);

            verifyTicket(decodedText);

            html5QrcodeScanner.clear();
        }


        function onScanFailure(error) {
            // Ignore unsuccessful frames.
        }


        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );


        html5QrcodeScanner.render(
            onScanSuccess,
            onScanFailure
        );

    </script>

</body>
</html>
